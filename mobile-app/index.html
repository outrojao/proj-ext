<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123b35" />
    <meta name="description" content="Central mobile para pedidos, estoque e automações." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Balcão 27 | Operação</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#pedidos" aria-label="Balcão 27, pedidos">
          <span class="brand-mark" aria-hidden="true">27</span>
          <span class="brand-copy"><strong>Balcão 27</strong><small>PAINEL DE OPERAÇÃO</small></span>
        </a>
        <div class="topbar-right">
          <span class="demo-tag"><span></span> AMBIENTE DE TESTE</span>
          <button class="store-state" id="store-toggle" type="button" aria-pressed="true">
            <span class="store-dot"></span><span id="store-label">Loja aberta</span><span class="state-chevron">⌄</span>
          </button>
          <button class="avatar" type="button" aria-label="Perfil da equipe">M</button>
        </div>
      </header>

      <main id="main-content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <button class="nav-item is-active" type="button" data-view="orders" aria-current="page"><span class="nav-icon" data-icon="receipt"></span><span>Pedidos</span><b class="nav-count" id="nav-count">2</b></button>
        <button class="nav-item" type="button" data-view="products"><span class="nav-icon" data-icon="box"></span><span>Estoque</span></button>
        <button class="nav-item" type="button" data-view="automation"><span class="nav-icon" data-icon="sliders"></span><span>Automação</span><i class="nav-alert" id="nav-alert"></i></button>
      </nav>
      <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
